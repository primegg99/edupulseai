  };

  /* ---------- Evaluation engine ---------- */
  function norm(s) { return String(s || '').toLowerCase().replace(/[−–—]/g, '-').replace(/\s+/g, ' ').trim(); }

    if (/^[a-z0-9]{1,2}$/.test(s)) return new RegExp('(^|[^a-z0-9])' + s + '([^a-z0-9]|$)').test(t);
    return t.indexOf(s) !== -1;

  function evaluate(answer, kw) {
    var t = norm(answer), hit = [], miss = [];

    var ratio = kw.length ? hit.length / kw.length : 0;
    var level = ratio >= 0.6 ? 'correct' : ratio >= 0.3 ? 'partial' : 'improve';
    return { ratio: ratio, level: level, hit: hit, miss: miss, points: level === 'correct' ? 1 : level === 'partial' ? 0.5 : 0 };

  /* ---------- Knowledge base (built-in topics with hand-written model answers) ---------- */
  function F(q, a, kw, d, f, t) { return { q: q, a: a, kw: kw, d: d, f: f, t: t }; }
  var KB = [
    { keys: ['photosynth'], subject: 'Science', title: 'Photosynthesis',
      facts: [
        F('Define photosynthesis and write its balanced chemical equation.', 'Photosynthesis is the process by which green plants use sunlight, carbon dioxide and water to prepare glucose (food). Oxygen is released as a by-product. The overall reaction is 6CO₂ + 6H₂O → C₆H₁₂O₆ + 6O₂ in the presence of light and chlorophyll.', [['sunlight', 'light'], ['carbon dioxide', 'co2'], ['water', 'h2o'], ['glucose', 'food', 'sugar', 'carbohydrate'], ['oxygen', 'o2']], 'Easy', '6CO₂ + 6H₂O → C₆H₁₂O₆ + 6O₂ (light, chlorophyll)', 'Plants are producers: light energy is stored as chemical energy in glucose.'),
        F('What is the role of chlorophyll in photosynthesis?', 'Chlorophyll is the green pigment present in chloroplasts. It absorbs light energy, mainly red and blue light. This trapped energy drives the reactions that make food.', [['chlorophyll'], ['absorb', 'trap', 'capture'], ['light', 'sunlight'], ['chloroplast', 'green pigment', 'pigment']], 'Easy', 'Chlorophyll = light-absorbing pigment inside chloroplasts', 'No chlorophyll, no light capture, no photosynthesis.'),
        F('Name the two stages of photosynthesis and state where each takes place.', 'The light-dependent reactions occur in the thylakoid membranes (grana) of the chloroplast, where water splits and ATP and NADPH form. The light-independent reactions (Calvin cycle) occur in the stroma, where carbon dioxide is fixed into glucose.', [['light-dependent', 'light dependent', 'light reaction'], ['calvin', 'light-independent', 'light independent', 'dark reaction'], ['thylakoid', 'grana'], ['stroma'], ['chloroplast']], 'Medium', 'Light reaction → thylakoid; Calvin cycle → stroma', 'Light reaction makes ATP and NADPH; the Calvin cycle uses them to build sugar.'),
        F('What is the function of stomata in photosynthesis?', 'Stomata are tiny pores on the leaf surface surrounded by guard cells. They allow carbon dioxide to enter for photosynthesis and let oxygen and water vapour leave. This gas exchange is essential for the leaf.', [['stomata', 'stoma'], ['carbon dioxide', 'co2'], ['gas exchange', 'exchange', 'oxygen'], ['guard cell', 'pore', 'opening']], 'Medium', 'Stomata: gateway for CO₂ in, O₂ and water vapour out', 'Guard cells open and close the stomata to balance gas exchange and water loss.'),
        F('List four factors that affect the rate of photosynthesis and explain any one.', 'The rate depends on light intensity, carbon dioxide concentration, temperature and water availability. For example, as light intensity increases the rate rises until another factor becomes limiting, after which the rate stays constant.', [['light intensity', 'light'], ['carbon dioxide', 'co2'], ['temperature'], ['water'], ['limiting', 'increase', 'rate']], 'Medium', 'Limiting factor: the factor in shortest supply sets the rate', 'Rate rises with light and CO₂ up to a plateau; extreme heat denatures enzymes.'),
        F('Explain why photosynthesis is important for all life on Earth.', 'Photosynthesis produces glucose, the base of every food chain, so plants act as producers that feed all other organisms. It releases the oxygen that living things breathe. It also removes carbon dioxide from the air, helping to regulate the climate.', [['oxygen'], ['food', 'glucose', 'food chain', 'producer'], ['carbon dioxide', 'co2'], ['energy', 'climate', 'atmosphere', 'balance']], 'Hard', 'Producers → food chain → oxygen → carbon balance', 'It links sunlight to every living thing through food and oxygen.')
      ],
      mcqs: [
        { q: 'Which pigment traps sunlight during photosynthesis?', o: ['Chlorophyll', 'Melanin', 'Haemoglobin', 'Keratin'] },
        { q: 'Which gas is released as a by-product of photosynthesis?', o: ['Oxygen', 'Carbon dioxide', 'Nitrogen', 'Hydrogen'] },
        { q: 'In which cell organelle does photosynthesis take place?', o: ['Chloroplast', 'Mitochondria', 'Ribosome', 'Nucleus'] },
        { q: 'During the light reaction, which molecule is split (photolysis)?', o: ['Water', 'Glucose', 'Starch', 'Carbon dioxide'] }
      ] },
    { keys: ['quadratic'], subject: 'Mathematics', title: 'Quadratic Equations',
      facts: [
        F('Write the standard form of a quadratic equation and state the condition on its coefficients.', 'The standard form is ax² + bx + c = 0, where a, b and c are real numbers and a ≠ 0. If a were zero the equation would become linear, so a must be non-zero.', [['ax'], ['bx'], ['c'], ['= 0', '=0'], ['a ≠ 0', 'a≠0', 'not zero', 'not equal to zero', 'non-zero', 'nonzero', 'a != 0']], 'Easy', 'ax² + bx + c = 0,  a ≠ 0', 'The highest power of x is 2, which makes it quadratic.'),
        F('Solve x² − 5x + 6 = 0 by factorisation.', 'Split the middle term: x² − 2x − 3x + 6 = 0. Group the terms: x(x − 2) − 3(x − 2) = 0. So (x − 2)(x − 3) = 0. Hence x = 2 or x = 3.', [['factor', 'split', 'middle term', 'factoris', 'factoriz'], ['2'], ['3']], 'Easy', 'Find two numbers with sum −5 and product 6 → −2 and −3', 'Set each factor to zero to get the roots.'),
        F('State the quadratic formula and explain the role of the discriminant.', 'The roots are x = (−b ± √(b² − 4ac)) / 2a. The discriminant D = b² − 4ac decides the nature of the roots: D > 0 gives two distinct real roots, D = 0 gives two equal real roots, and D < 0 gives no real roots.', [['-b', 'minus b'], ['√', 'sqrt', 'square root'], ['b²-4ac', 'b^2-4ac', 'b2-4ac', 'discriminant'], ['2a'], ['real', 'equal', 'distinct', 'no real']], 'Medium', 'x = (−b ± √D) / 2a,  D = b² − 4ac', 'D > 0: two real roots · D = 0: equal roots · D < 0: no real roots.'),
        F('Write the relations between the roots and coefficients of ax² + bx + c = 0.', 'If α and β are the roots then the sum of the roots α + β = −b/a and the product of the roots αβ = c/a.', [['-b/a', 'minus b/a', 'minus b by a', '-b by a'], ['c/a', 'c by a'], ['sum'], ['product']], 'Medium', 'α + β = −b/a,  αβ = c/a', 'You can build an equation from its roots: x² − (sum)x + (product) = 0.'),
        F('Find the value of k for which x² + kx + 9 = 0 has equal roots.', 'For equal roots the discriminant must be zero, so D = k² − 4(1)(9) = 0. This gives k² = 36 and therefore k = ±6.', [['d = 0', 'd=0', 'discriminant', 'equal roots'], ['k²-36', 'k^2-36', 'k2-36', '36', 'k² = 36'], ['±6', '+-6', 'plus or minus 6', '6', '-6']], 'Hard', 'Equal roots ⇔ b² − 4ac = 0', 'Always put the discriminant equal to zero for repeated roots.')
      ],
      mcqs: [
        { q: 'What is the degree of a quadratic equation?', o: ['2', '1', '3', '0'] },
        { q: 'If the discriminant is negative, the quadratic equation has:', o: ['No real roots', 'Two distinct real roots', 'Two equal real roots', 'Exactly one root'] },
        { q: 'What are the roots of x² − 9 = 0?', o: ['3 and −3', '9 and −9', '3 only', '0 and 9'] },
        { q: 'The sum of the roots of x² − 7x + 12 = 0 is:', o: ['7', '12', '−7', '−12'] }
      ] },
    { keys: ['newton'], subject: 'Physics', title: "Newton's Laws of Motion",
      facts: [
        F("State Newton's first law of motion and name the property it describes.", 'A body remains at rest or in uniform motion in a straight line unless an external unbalanced force acts on it. This property of a body to resist any change in its state of rest or motion is called inertia.', [['inertia'], ['rest'], ['uniform motion', 'constant velocity', 'straight line', 'motion'], ['unbalanced force', 'external force', 'net force', 'force']], 'Easy', 'Inertia: bodies resist a change in their state of motion', 'Heavier objects have more inertia.'),
        F("State Newton's second law and derive the formula for force.", 'The rate of change of momentum of a body is directly proportional to the net unbalanced force applied, in the direction of the force. For constant mass this gives F = ma, the force equals mass times acceleration.', [['f = ma', 'f=ma', 'force = mass', 'mass × acceleration', 'mass x acceleration', 'mass times acceleration'], ['net force', 'unbalanced', 'resultant'], ['proportional', 'directly'], ['momentum', 'rate of change']], 'Medium', 'F = ma  (SI unit of force: newton, N)', 'Same force on a smaller mass gives a larger acceleration.'),
        F("State Newton's third law with an example.", 'To every action there is an equal and opposite reaction. The action and reaction act on two different bodies, so they do not cancel. For example, when you push a wall, the wall pushes you back with an equal force.', [['action'], ['reaction'], ['equal'], ['opposite'], ['different bod', 'two bod', 'two object', 'different object', 'example', 'wall', 'rocket']], 'Easy', 'Force pairs: equal in size, opposite in direction, on different bodies', 'Forces in a pair never act on the same object.'),
        F('A force acts on a 5 kg object and gives it an acceleration of 2 m/s². Calculate the force.', 'Use F = ma. Here m = 5 kg and a = 2 m/s². Therefore F = 5 × 2 = 10 N.', [['f = ma', 'f=ma', 'force = mass', '5 × 2', '5x2', '5*2', '5 x 2'], ['10'], ['newton', 'n']], 'Easy', 'F = ma → F = 5 × 2 = 10 N', 'Always write the unit: force is measured in newtons.'),
        F('Why do passengers jerk forward when a moving bus suddenly brakes?', 'Passengers were moving along with the bus. When the bus stops suddenly, the lower part of the body stops with it but the upper part tends to continue in its state of motion because of inertia. So the passengers lurch forward.', [['inertia'], ['forward'], ['motion', 'moving'], ['body', 'upper', 'passenger']], 'Medium', 'Law of inertia in everyday life', 'Seat belts apply the unbalanced force that stops your body safely.'),
        F("Explain how a rocket moves using Newton's third law and conservation of momentum.", 'A rocket pushes hot exhaust gases backwards at high speed (action). The gases push the rocket forward with an equal and opposite force (reaction). The backward momentum of the gas equals the forward momentum gained by the rocket, so total momentum is conserved.', [['rocket'], ['gas', 'exhaust'], ['action'], ['reaction', 'opposite'], ['momentum']], 'Hard', 'm₁v₁ = −m₂v₂ (momentum conserved)', 'Rockets work even in vacuum because they push against their own exhaust, not the air.')
      ],
      mcqs: [
        { q: 'What is the SI unit of force?', o: ['Newton', 'Joule', 'Watt', 'Pascal'] },
        { q: "Which law of motion is also called the law of inertia?", o: ['First law', 'Second law', 'Third law', 'Law of gravitation'] },
        { q: 'A force of 50 N acts on a 10 kg object. Its acceleration is:', o: ['5 m/s²', '0.2 m/s²', '500 m/s²', '60 m/s²'] },
        { q: "Which expression represents Newton's second law?", o: ['F = ma', 'F = mv', 'F = m/a', 'F = a/m'] }
      ] },
    { keys: ['french revolution', 'bastille'], subject: 'Social Science', title: 'The French Revolution',
      facts: [
        F('Name the three Estates of pre-revolutionary French society.', 'The First Estate was the clergy, the Second Estate was the nobility, and the Third Estate consisted of commoners such as peasants, artisans and the middle class. Only the Third Estate paid most of the taxes.', [['clergy', 'first estate'], ['nobility', 'noble', 'second estate'], ['third estate', 'commoner', 'peasant', 'bourgeois', 'middle class'], ['tax']], 'Easy', 'Clergy · Nobility · Commoners', 'The Third Estate was the largest group but had the least privilege.'),
        F('Why is the storming of the Bastille important?', 'On 14 July 1789 a Parisian crowd stormed the Bastille, a royal prison-fortress. It was a symbol of the king’s despotic power, so its fall marked the beginning of the revolution. The day is now celebrated as France’s national day.', [['bastille'], ['14 july', 'july 14', '1789'], ['prison', 'fortress'], ['symbol', 'tyranny', 'royal', 'despot', 'king']], 'Easy', 'Date: 14 July 1789', 'The Bastille symbolised absolute monarchy.'),
        F('List the main causes of the French Revolution.', 'The state was near bankruptcy because of wars and royal spending. Unfair taxation burdened the Third Estate while the clergy and nobility were exempt. A subsistence crisis raised the price of bread. The ideas of philosophers such as Rousseau, Voltaire and Montesquieu inspired demands for equality.', [['tax', 'taxation'], ['estate', 'clergy', 'nobility', 'third estate', 'privilege'], ['bread', 'food', 'famine', 'price', 'hunger'], ['enlightenment', 'philosoph', 'rousseau', 'voltaire', 'montesquieu'], ['debt', 'bankrupt', 'financial', 'war']], 'Medium', 'Economic + social + intellectual causes', 'Revolutions need both grievances and ideas.'),
        F('What was the Declaration of the Rights of Man and the Citizen?', 'Adopted by the National Assembly in August 1789, it declared that all men are born free and equal in rights. It guaranteed liberty, property, security and resistance to oppression, and became the foundation of modern human-rights thinking.', [['1789'], ['liberty', 'freedom', 'free'], ['equality', 'equal'], ['rights'], ['national assembly']], 'Medium', 'Liberty · Equality · Rights of citizens', 'Sovereignty passed from the king to the nation.'),
        F('What was the Reign of Terror? Name its chief leader.', 'From 1793 to 1794 the Committee of Public Safety under Maximilien Robespierre ruled by terror. Suspected enemies of the republic were arrested and executed by the guillotine. It ended with Robespierre’s own execution in July 1794.', [['robespierre'], ['guillotine', 'execut'], ['jacobin', 'committee of public safety', 'committee'], ['1793', '1794'], ['enemies', 'suspect', 'republic']], 'Hard', '1793–1794 · Robespierre · Guillotine', 'Extreme measures in the name of the revolution turned into repression.'),
        F('Assess the long-term impact of the French Revolution on France and the world.', 'It ended absolute monarchy and feudal privileges and established the ideals of liberty, equality and fraternity. It inspired democratic and nationalist movements across Europe and the colonies, and it paved the way for Napoleon’s rise.', [['liberty', 'freedom'], ['equality'], ['fraternity'], ['democra', 'republic'], ['napoleon'], ['monarchy', 'feudal', 'abolish']], 'Hard', 'Liberty · Equality · Fraternity', 'The revolution changed the idea of who holds power in a state.')
      ],
      mcqs: [

            <div className="font-display text-sm font-bold text-[#c9a0ff]">EDUPULSE AI · MOCK EXAMINATION</div>
            <h2 className="font-display mt-1 text-2xl font-extrabold text-white sm:text-3xl">${paper.subject}: ${paper.chapter}</h2>
            <div className="mt-2 flex flex-wrap justify-center gap-2 text-sm">
              <${Badge} cls="border-[#a855f7]/40 text-[#c9a0ff] bg-[#a855f7]/10">${paper.cls}<//>
              <${Badge} cls=${paper.extreme ? DIFF.Extreme : 'border-[#00f3ff]/40 text-[#00f3ff] bg-[#00f3ff]/10'}>${paper.extreme ? 'Extreme Exam Cracker Level' : 'Standard Board Level'}<//>
            </div>
            <div className="mt-4 flex justify-center gap-8 text-sm text-slate-300">
              <span>Time allowed: <b className="text-white">${paper.cfg.time >= 120 ? paper.cfg.time / 60 + ' hours' : paper.cfg.time + ' minutes'}</b></span>
              <span>Maximum marks: <b className="text-white">${paper.cfg.max}</b></span>
            </div>
            <ul className="mx-auto mt-4 max-w-xl list-disc space-y-1 pl-5 text-left text-sm text-slate-400">
              <li>All questions are compulsory. Marks are shown against each question.</li>
              <li>Section A has ${paper.cfg.aN} MCQs of ${paper.cfg.aM} mark${paper.cfg.aM > 1 ? 's' : ''} each. Tap one option per question.</li>
              <li>Section B: short answers (${paper.cfg.bM} marks each). Section C: HOTS / long answers (${paper.cfg.cM} marks each).</li>
              <li>Write clearly and support every answer with reasons or examples.</li>
            </ul>
            ${!paper.builtIn && html`<p className="no-print mt-3 text-xs text-slate-500">This chapter is outside the built-in library, so questions use adaptive templates. Built-in chapters: Photosynthesis, Quadratic Equations, Newton's Laws, French Revolution, Verbs & Tenses, Fractions.</p>`}
          </header>

          <div className="mt-6">
            <h3 className="font-display text-lg font-bold text-[#00f3ff]">Section A · Multiple Choice <span className="text-sm font-medium text-slate-400">(${paper.cfg.aN} × ${paper.cfg.aM} = ${aTotal} marks)</span></h3>
            ${showSol && html`<p className="pop mt-2 text-sm font-semibold text-[#00ff66]">Your MCQ score: ${mcqScore} / ${mcqTotal}</p>`}
            <div className="mt-3 space-y-4">
              ${paper.mcqs.map(function (m, i) {
                return html`<div key=${m.id} className="avoid-break rounded-xl border border-white/10 bg-black/20 p-4">
                  <p className="font-semibold text-white"><span className="text-[#00f3ff]">${i + 1}.</span> ${m.q} <span className="text-xs font-normal text-slate-500">[${m.marks}]</span></p>
                  <div className="mt-3 grid gap-2 sm:grid-cols-2">
                    ${m.opts.map(function (o, k) {
                      var chosen = sel[m.id] === k, right = showSol && k === m.ans, wrong = showSol && chosen && k !== m.ans;
                      var cls = right ? 'border-[#00ff66] bg-[#00ff66]/15 text-[#00ff66]' : wrong ? 'border-[#ff007f] bg-[#ff007f]/15 text-[#ff5fa8]' : chosen ? 'border-[#a855f7] bg-[#a855f7]/20 text-white' : 'border-white/10 bg-white/5 text-slate-300 hover:border-[#a855f7]/60';
                      return html`<button key=${k} className=${'rounded-xl border px-3 py-2 text-left text-sm transition ' + cls} aria-pressed=${chosen}
                        onClick=${function () { setSel(function (s) { var n = Object.assign({}, s); n[m.id] = k; return n; }); }}>
                        <b className="mr-2">${String.fromCharCode(65 + k)}.</b>${o}
                      </button>`;
                    })}
                  </div>
                </div>`;
              })}
            </div>
          </div>

          <div className="mt-8">
            <h3 className="font-display text-lg font-bold text-[#c9a0ff]">Section B · Short Answer <span className="text-sm font-medium text-slate-400">(${paper.cfg.bN} × ${paper.cfg.bM} = ${bTotal} marks)</span></h3>
            <div className="mt-3 space-y-4">${paper.short.map(function (q, i) { return Question(q, 'B' + (i + 1)); })}</div>
          </div>

          <div className="mt-8">
            <h3 className="font-display text-lg font-bold text-[#ff5fa8]">Section C · HOTS / Long Answer <span className="text-sm font-medium text-slate-400">(${paper.cfg.cN} × ${paper.cfg.cM} = ${cTotal} marks)</span></h3>
            <div className="mt-3 space-y-4">${paper.long.map(function (q, i) { return Question(q, 'C' + (i + 1)); })}</div>
          </div>
          <p className="mt-8 text-center text-sm text-slate-500">— End of paper —</p>
        </article>
      </section>`}
    </div>`;
  }

  /* ---------- App shell ---------- */
  function App() {
    var _t = useState(window.location.hash === '#paper' ? 'paper' : 'practice'), tab = _t[0], setTab = _t[1];
    function go(t) { setTab(t); window.scrollTo({ top: 0, behavior: 'smooth' }); }
    var tabBtn = function (id, label, on) {
      return html`<button className=${'rounded-xl px-3 py-2 text-sm font-semibold transition sm:px-4 ' + (tab === id ? on : 'text-slate-400 hover:text-white')} onClick=${function () { go(id); }} aria-current=${tab === id ? 'page' : undefined}>${label}</button>`;
    };
    return html`<div>
      <header className="app-header no-print">
        <div className="mx-auto flex max-w-6xl items-center justify-between gap-3 px-4 py-3">
          <div className="flex items-center gap-2">
            <span className="flex h-9 w-9 items-center justify-center rounded-xl" style=${{ background: 'linear-gradient(135deg,#00f3ff,#a855f7)', boxShadow: '0 0 16px rgba(0,243,255,.5)', color: '#04070c' }}><${Icon} name="zap" size=${20} /></span>
            <span className="font-display text-lg font-extrabold text-white">EduPulse <span className="text-[#00f3ff]">AI</span></span>
          </div>
          <nav className="flex gap-1 rounded-2xl border border-white/10 bg-black/30 p-1" aria-label="Sections">
            ${tabBtn('practice', 'Practice', 'bg-[#00f3ff] text-[#021316]')}
            ${tabBtn('paper', 'Paper Cracker', 'bg-[#a855f7] text-white')}
          </nav>
        </div>
        <nav className="mx-auto flex max-w-6xl flex-wrap gap-x-5 gap-y-2 px-4 pb-3 text-sm text-slate-300" aria-label="Main navigation">
          <a href="index.html">Homepage</a><a href="about-us.html">About Us</a><a href="privacy-policy.html">Privacy Policy</a><a href="terms-of-service.html">Terms of Service</a>
        </nav>
      </header>
      <main>${tab === 'practice' ? html`<${Practice} goPaper=${function () { go('paper'); }} />` : html`<${PaperCracker} />`}</main>
      <footer className="no-print mx-auto max-w-4xl px-4 pb-10 text-center text-xs text-slate-400"><p>Study answers are processed in your browser. Feedback compares key terms with a model answer and is a study guide, not an official grade.</p><nav className="mt-4 flex flex-wrap justify-center gap-4" aria-label="Footer navigation"><a href="index.html">Homepage</a><a href="about-us.html">About Us & FAQs</a><a href="privacy-policy.html">Privacy Policy</a><a href="terms-of-service.html">Terms of Service</a></nav></footer>
    </div>`;
  }

  ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
})();
</script>
</body>
</html>
